services:
  vizdoom-rl:
    build: .
    image: vizdoom-rl:latest
    container_name: vizdoom-rl-training
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DISPLAY=${DISPLAY}
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    ports:
      - "8888:8888"
      - "6006:6006"
    shm_size: '24gb'
    stdin_open: true
    tty: true
    command: /bin/bash
